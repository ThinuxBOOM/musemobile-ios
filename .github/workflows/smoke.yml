name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # Hardware-free unit layers: JS/bridge consistency + Swift logic tests
    # compiled against the real sources (no Xcode project changes needed).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Consistency checks
        run: python3 ci/check_consistency.py
      - name: Swift logic tests
        run: |
          swiftc -o /tmp/logictests \
            MuseMobileiOS/WebView/AdIdStore.swift \
            MuseMobileiOS/WebView/AdBlocker.swift \
            MuseMobileiOS/Core/JSStripper.swift \
            MuseMobileiOS/Updater/Updater.swift \
            MuseMobileiOS/Core/AppSettings.swift \
            MuseMobileiOS/Core/Constants.swift \
            MuseMobileiOS/Offline/OfflineStore.swift \
            ci/logic_tests/main.swift
          /tmp/logictests
  build:
    # Unsigned build + IPA packaging (no Team, no signing). Sideloadly /
    # AltStore re-sign the unsigned IPA on install with your own Apple ID,
    # so no Mac is needed to get it on a phone.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Show versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build (unsigned)
        run: |
          xcodebuild -project MuseMobileiOS.xcodeproj \
            -scheme MuseMobileiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p pkg/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/MuseMobileiOS.app pkg/Payload/
          cd pkg && zip -r ../MuseMobileiOS-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuseMobileiOS-unsigned
          path: MuseMobileiOS-unsigned.ipa

  simtest:
    # No-iPhone smoke test: boot an iPhone Simulator on the CI Mac, install
    # the app, launch it, and capture a screenshot. Proves launch + WebView
    # load with zero Apple hardware of your own. NOTE: Simulator cannot play
    # DRM audio or log into Spotify for real — login + playback still need a
    # physical device (see README §Ship to iPhone).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Build for Simulator (unsigned)
        run: |
          xcodebuild -project MuseMobileiOS.xcodeproj \
            -scheme MuseMobileiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/SimDerived \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Create + boot Simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r['name'].startswith('iOS') and r['isAvailable']]; print(sorted(rs, key=lambda r: r['version'])[-1]['identifier'])")
          echo "Using runtime: $RUNTIME"
          UDID=$(xcrun simctl create smokesim com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Install + launch app
        run: |
          xcrun simctl install "$SIM_UDID" "build/SimDerived/Build/Products/Debug-iphonesimulator/MuseMobileiOS.app"
          PID=$(xcrun simctl launch "$SIM_UDID" com.musemobile.ios | awk '{print $NF}')
          echo "APP_PID=$PID" >> $GITHUB_ENV
          echo "Launched, pid=$PID — waiting 30s for WebView load…"
          sleep 30
      - name: Screenshot
        run: xcrun simctl io "$SIM_UDID" screenshot screen.png
      - name: Crash check (log-based)
        # NOTE: kill -0 via simctl spawn is unreliable (sim user-namespace
        # quirk: getpwuid_r fails for the host uid, kill returns EPERM on a
        # living process). Instead: the running app logs WebKit activity
        # continuously, so recent MuseMobileiOS lines + no crash markers =
        # alive. A dead app logs nothing and/or crash-reporter lines.
        run: |
          LOGS=$(xcrun simctl spawn "$SIM_UDID" log show --last 45s --predicate 'process == "MuseMobileiOS"' --info 2>/dev/null | tail -60)
          echo "$LOGS"
          if echo "$LOGS" | grep -qiE "crashed|EXC_BAD|SIGABRT|SIGSEGV|termination reason|abort\(\)"; then
            echo "CRASH MARKERS FOUND ❌"
            exit 1
          elif ! echo "$LOGS" | grep -q "MuseMobileiOS"; then
            echo "NO RECENT ACTIVITY — app likely died silently ❌"
            exit 1
          else
            echo "APP ALIVE ✅ (recent activity, no crash markers)"
          fi
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screen.png
      - name: Cleanup
        if: always()
        run: |
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl delete "$SIM_UDID" || true

name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Unsigned build + IPA packaging (no Team, no signing). Sideloadly /
    # AltStore re-sign the unsigned IPA on install with your own Apple ID,
    # so no Mac is needed to get it on a phone.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Show versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build (unsigned)
        run: |
          xcodebuild -project MuseMobileiOS.xcodeproj \
            -scheme MuseMobileiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p pkg/Payload
          cp -R build/DerivedData/Build/Products/Debug-iphoneos/MuseMobileiOS.app pkg/Payload/
          cd pkg && zip -r ../MuseMobileiOS-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MuseMobileiOS-unsigned
          path: MuseMobileiOS-unsigned.ipa
